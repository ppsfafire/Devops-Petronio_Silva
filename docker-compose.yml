version: '3.8'

services:
  backend:
    image: ppsfafire/devops-backend:latest
    container_name: devops-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    networks:
      - devops-network

  frontend:
    image: ppsfafire/devops-frontend:latest
    container_name: devops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:5000
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
