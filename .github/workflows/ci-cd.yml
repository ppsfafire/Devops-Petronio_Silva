name: CI/CD Pipeline

on:
  push:
    branches: [ dev, staging, master ]
  pull_request:
    branches: [ dev, staging, master ]

env:
  EC2_HOST: ec2-18-117-195-190.us-east-2.compute.amazonaws.com
  EC2_IP: 18.117.195.190
  EC2_USER: admin
  DOCKER_USERNAME: ppsfafire

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm run install:all

    - name: Run backend tests
      run: |
        cd backend
        npm test --if-present

    - name: Run frontend tests
      run: |
        cd frontend
        npm test --if-present

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      run: |
        cd backend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-backend:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-backend:latest .
        docker push ${{ env.DOCKER_USERNAME }}/devops-backend:${{ github.sha }}
        docker push ${{ env.DOCKER_USERNAME }}/devops-backend:latest

    - name: Build and push frontend image
      run: |
        cd frontend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-frontend:latest .
        docker push ${{ env.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }}
        docker push ${{ env.DOCKER_USERNAME }}/devops-frontend:latest

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/devops-app
          docker-compose pull
          docker-compose up -d
          docker-compose ps

    - name: Health check
      run: |
        sleep 30
        curl -f http://${{ env.EC2_IP }}:3001/api/health || exit 1

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    
    steps:
    - name: Deploy to EC2 (Staging)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/devops-app
          docker-compose pull
          docker-compose up -d
          docker-compose ps

    - name: Health check (Staging)
      run: |
        sleep 30
        curl -f http://${{ env.EC2_IP }}:3001/api/health || exit 1

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - name: Deploy to EC2 (Production)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/devops-app
          docker-compose pull
          docker-compose up -d
          docker-compose ps

    - name: Health check (Production)
      run: |
        sleep 30
        curl -f http://${{ env.EC2_IP }}:3001/api/health || exit 1

    - name: Notify deployment success
      run: |
        echo "🚀 Deploy para produção concluído com sucesso!"
        echo "📅 Data: $(date)"
        echo "🔗 Branch: ${{ github.ref }}"
        echo "👤 Autor: ${{ github.actor }}"
        echo "🌐 URL: http://${{ env.EC2_IP }}"
