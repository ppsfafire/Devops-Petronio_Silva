name: CI/CD Pipeline

on:
  push:
    branches: [ dev, staging, master ]
  pull_request:
    branches: [ dev, staging, master ]

env:
  EC2_HOST: ec2-18-117-195-190.us-east-2.compute.amazonaws.com
  EC2_IP: 18.117.195.190
  EC2_USER: admin
  DOCKER_USERNAME: ppsfafire

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm run install:all

    - name: Run backend tests
      run: |
        cd backend
        npm test --if-present

    - name: Run frontend tests
      run: |
        cd frontend
        npm test --if-present

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      run: |
        cd backend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-backend:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-backend:latest .
        docker push ${{ env.DOCKER_USERNAME }}/devops-backend:${{ github.sha }}
        docker push ${{ env.DOCKER_USERNAME }}/devops-backend:latest

    - name: Build and push frontend image
      run: |
        cd frontend
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_USERNAME }}/devops-frontend:latest .
        docker push ${{ env.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }}
        docker push ${{ env.DOCKER_USERNAME }}/devops-frontend:latest

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Criar diretório se não existir
          sudo mkdir -p /opt/devops-app
          sudo chown $USER:$USER /opt/devops-app
          cd /opt/devops-app
          
          # Instalar docker-compose se não estiver instalado
          if ! command -v docker-compose &> /dev/null; then
            echo "Instalando docker-compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Criar docker-compose.yml se não existir
          if [ ! -f docker-compose.yml ]; then
            cat > docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            frontend:
              image: ppsfafire/devops-frontend:latest
              ports:
                - "3000:3000"
              environment:
                - REACT_APP_API_URL=http://localhost:5000
              depends_on:
                - backend
              restart: unless-stopped
            
            backend:
              image: ppsfafire/devops-backend:latest
              ports:
                - "5000:5000"
              environment:
                - NODE_ENV=production
                - PORT=5000
              restart: unless-stopped
              volumes:
                - ./logs:/app/logs
          
          networks:
            default:
              driver: bridge
          EOF
          fi
          
          # Parar containers existentes
          docker-compose down || true
          
          # Fazer pull das imagens
          docker-compose pull
          
          # Iniciar containers
          docker-compose up -d
          
          # Verificar status
          docker-compose ps
          
          # Aguardar um pouco e verificar logs
          sleep 10
          echo "=== Logs do Backend ==="
          docker-compose logs backend --tail=20
          echo "=== Logs do Frontend ==="
          docker-compose logs frontend --tail=20

    - name: Health check
      run: |
        sleep 30
        echo "🔍 Verificando saúde da aplicação..."
        echo "📡 Testando backend na porta 5000..."
        curl -f http://${{ env.EC2_IP }}:5000/api/health || echo "❌ Backend não respondeu"
        echo "📡 Testando frontend na porta 3000..."
        curl -f http://${{ env.EC2_IP }}:3000 || echo "❌ Frontend não respondeu"
        echo "✅ Health check concluído!"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    
    steps:
    - name: Deploy to EC2 (Staging)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Criar diretório se não existir
